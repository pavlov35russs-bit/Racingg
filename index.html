<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой TWA</title>
    <!-- Подключаем SDK Телеги, без него нихуя не заработает -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="greeting">Загрузка...</h1>
        <p>Это твой первый Web App внутри Telegram.</p>
        
        <button id="main-btn" class="tg-button">Нажми меня, ёпта</button>
        <button id="close-btn" class="tg-button secondary">Закрыть</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
